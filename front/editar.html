<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editar vino</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="pagina pagina--ancha">
    <h1 class="titulo">Editar Vino</h1>

    <form class="edicion" action="#">

      <!-- Foto -->
      <div class="foto">
        <img class="foto__botella" src="botella-grande.png" width="295" height="1168"
             alt="Botella de vino tinto con etiqueta de uvas y viñedo">
        <label class="foto__editar" for="foto">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 20l1-4.5L16.5 4a2.1 2.1 0 013 3L8 18.5 4 20z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M14.5 6l3.5 3.5M5 15.5l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <span class="solo-lectores">Cambiar foto</span>
        </label>
        <input class="solo-lectores" id="foto" name="foto" type="file" accept="image/*">
      </div>

      <!-- Datos -->
      <div class="campos">
        <label class="solo-lectores" for="nombre">Nombre</label>
        <input class="entrada" id="nombre" name="nombre" type="text" placeholder="Nombre">

        <label class="solo-lectores" for="tipo">Tipo</label>
        <input class="entrada" id="tipo" name="tipo" type="text" placeholder="Tipo">

        <label class="solo-lectores" for="anada">Añada</label>
        <input class="entrada" id="anada" name="anada" type="text" inputmode="numeric" placeholder="Añada">

        <label class="solo-lectores" for="volumen">Volumen</label>
        <input class="entrada" id="volumen" name="volumen" type="text" inputmode="decimal" placeholder="Volumen">

        <label class="solo-lectores" for="graduacion">Graduación</label>
        <input class="entrada" id="graduacion" name="graduacion" type="text" inputmode="decimal" placeholder="Graduación">

        <label class="solo-lectores" for="precio">Precio</label>
        <input class="entrada" id="precio" name="precio" type="text" inputmode="decimal" placeholder="Precio">

        <label class="solo-lectores" for="cuit">Cuit de la Bodega</label>
        <input class="entrada entrada--completa" id="cuit" name="cuit" type="text" inputmode="numeric" placeholder="Cuit de la Bodega">
      </div>

      <!-- Cepas y maridajes -->
      <div class="listas">
        <details class="desplegable" open>
          <summary class="desplegable__titulo">
            <span>Cepas</span>
            <span class="desplegable__flecha" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
          </summary>
          <!-- ID lista-cepas -->
          <ul class="items" id="lista-cepas">
            <li class="item" id="fila-agregar-cepa">
              <!-- Desplegable de cepas -->
              <select class="item__entrada" id="select-cepa" style="cursor: pointer; padding-right: 0;">
                <option value="" disabled selected>Elegir cepa...</option>
                <optgroup label="Tintas">
                  <option value="1">Malbec</option>
                  <option value="2">Cabernet Sauvignon</option>
                  <option value="3">Merlot</option>
                  <option value="4">Syrah</option>
                  <option value="5">Bonarda</option>
                  <option value="6">Tempranillo</option>
                  <option value="7">Pinot Noir</option>
                </optgroup>
                <optgroup label="Blancas">
                  <option value="8">Chardonnay</option>
                  <option value="9">Sauvignon Blanc</option>
                  <option value="10">Torrontés</option>
                  <option value="11">Chenin Blanc</option>
                  <option value="12">Semillón</option>
                </optgroup>
              </select>
              
              <!-- Campo numérico para el porcentaje -->
              <input class="item__entrada" id="input-porcentaje" type="number" min="1" max="100" placeholder="%" style="max-width: 4rem; text-align: center; border-left: 2px solid var(--tinta); border-radius: 0;">
              
              <!-- Agregamos un ID al botón para capturarlo en JS -->
              <button class="item__boton" id="btn-add-cepa" type="button" aria-label="Agregar cepa">+</button>
            </li>
          </ul>
        </details>

        <details class="desplegable" open>
          <summary class="desplegable__titulo">
            <span>Maridajes</span>
            <span class="desplegable__flecha" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
          </summary>
          <!-- Checklist de maridajes -->
          <div id="lista-maridajes" style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; padding: 1rem 0.5rem;">
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
              <input type="checkbox" name="maridaje" value="1" style="width: 1.2rem; height: 1.2rem; cursor: pointer;"> Carnes rojas
            </label>
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
              <input type="checkbox" name="maridaje" value="2" style="width: 1.2rem; height: 1.2rem; cursor: pointer;"> Quesos duros
            </label>
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
              <input type="checkbox" name="maridaje" value="3" style="width: 1.2rem; height: 1.2rem; cursor: pointer;"> Pastas (salsa roja)
            </label>
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
              <input type="checkbox" name="maridaje" value="4" style="width: 1.2rem; height: 1.2rem; cursor: pointer;"> Carnes blancas
            </label>
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
              <input type="checkbox" name="maridaje" value="5" style="width: 1.2rem; height: 1.2rem; cursor: pointer;"> Quesos blandos
            </label>
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
              <input type="checkbox" name="maridaje" value="6" style="width: 1.2rem; height: 1.2rem; cursor: pointer;"> Pescados/mariscos
            </label>
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
              <input type="checkbox" name="maridaje" value="7" style="width: 1.2rem; height: 1.2rem; cursor: pointer;"> Entradas/fiambres
            </label>
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
              <input type="checkbox" name="maridaje" value="8" style="width: 1.2rem; height: 1.2rem; cursor: pointer;"> Postres
            </label>
          </div>
        </details>
      </div>

      <p class="error" id="caja-error" aria-live="polite" style="display: none;"></p>

      <div class="botones">
        <button id="btn-guardar" class="boton" type="button">Guardar cambios</button>
        <a id="btn-cancelar" class="boton" href="detalle.html">Cancelar</a>
      </div>
    </form>
  </main>
  
  <script src="api.js"></script>
  <script src="editar.js"></script>
</body>
</html>
