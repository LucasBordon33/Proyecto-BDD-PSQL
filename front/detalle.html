<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalle de vino</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 1. Agregamos la clase pagina-detalle -->
  <main class="pagina pagina-detalle">
    
    <!-- 2. Botón volver al principio del main -->
    <a href="index.html" class="volver" style="margin-bottom: 1.5rem;">
      <svg class="volver__icono" viewBox="0 0 24 24" aria-hidden="true" style="width: 2.2rem; height: 2.2rem;">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="currentColor"/>
      </svg>
      Volver al catálogo
    </a>

    <h1 class="titulo">Catálogo</h1>

    <article class="detalle">
      <img class="detalle__botella" src="botella-grande.png" width="295" height="1168" alt="Botella">

      <!-- Columna central: Los datos restaurados -->
      <div class="detalle__datos">
        <h2 class="detalle__nombre">Nombre vino</h2>
        <p class="detalle__precio">$0,00</p>
        
        <section class="detalle__seccion">
          <h3>Ficha Técnica</h3>
          <ul style="list-style: none; padding: 0; line-height: 1.8;">
            <li><strong>Tipo:</strong> <span id="vino-tipo">Cargando...</span></li>
            <li><strong>Añada:</strong> <span id="vino-anada">Cargando...</span></li>
            <li><strong>Volumen:</strong> <span id="vino-volumen">Cargando...</span> ml</li>
            <li><strong>Graduación:</strong> <span id="vino-graduacion">Cargando...</span>%</li>
            <li><strong>Bodega (CUIT):</strong> <span id="vino-cuit">Cargando...</span></li>
          </ul>
        </section>

        <section class="detalle__seccion">
          <h3>Composición</h3>
          <p id="vino-composicion">Cargando...</p>
        </section>

        <section class="detalle__seccion">
          <h3>Maridaje</h3>
          <p id="vino-maridaje">Cargando...</p>
        </section>
      </div>

      <!-- Tercera columna: Botones -->
      <div class="acciones">
        <a id="btn-nueva-venta" class="boton" href="#">Nueva venta</a>
        <a id="btn-editar" class="boton" href="#">Editar</a>
      </div>
    </article>
  </main>
  
  <!-- Vinculamos la API y el nuevo script de esta pantalla -->
  <script src="api.js"></script>
  <script src="detalle.js"></script>
</body>
</html>
