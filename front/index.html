<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de vinos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="pagina">
    <h1 class="titulo">Catálogo</h1>

    <div class="herramientas">
      <form class="buscador" role="search" action="#">
        <label class="solo-lectores" for="buscar">Buscar vino</label>
        <svg class="buscador__icono" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="3.5"/>
          <path d="M15 15l6 6" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
        <input id="buscar" type="search" name="q" placeholder="Buscar vino">
      </form>

      <button class="filtro" type="button" aria-label="Filtrar vinos">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 5h18M3 12h18M3 19h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="8" cy="5" r="2.4" fill="currentColor"/>
          <circle cx="16" cy="12" r="2.4" fill="currentColor"/>
          <circle cx="8" cy="19" r="2.4" fill="currentColor"/>
        </svg>
      </button>
      <div class="contenedor-mas" style="position: relative;">
        <!--botón + -->
        <button type="button" id="btn-opciones-mas" class="filtro btn-mas" aria-label="Opciones de creación">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14M5 12h14"/>
          </svg>
        </button>
        
        <!-- El menú desplegable oculto -->
        <ul id="menu-mas" class="menu-mas">
          <li>
            <a href="agregar.html">Nuevo Vino</a>
          </li>
          <li>
            <a href="transferencias.html">Transferencias</a>
          </li>
          <li>
            <a href="tablero.html">Tablero</a>
          </li>
        </ul>
      </div>
    </div>

<!-- Panel de Filtros -->
    <div id="panel-filtros" class="panel-filtros" style="display: none;">
      <div class="grupo-filtro">
        <label for="filtro-tipo">Tipo</label>
        <select id="filtro-tipo">
          <option value="">Todos</option>
          <option value="tinto">Tinto</option>
          <option value="blanco">Blanco</option>
          <option value="rosado">Rosado</option>
        </select>
      </div>
      <div class="grupo-filtro">
        <label for="filtro-cepa">Cepa</label>
        <input type="text" id="filtro-cepa" placeholder="Ej. Malbec">
      </div>
      <div class="grupo-filtro">
        <label for="filtro-bodega">Bodega (CUIT)</label>
        <input type="text" id="filtro-bodega" placeholder="Ej. 30-11111111-1">
      </div>
      <div class="grupo-filtro">
        <label for="filtro-anada">Añada</label>
        <input type="number" id="filtro-anada" placeholder="Ej. 2022">
      </div>
      <button id="btn-aplicar-filtros" class="btn-primario">Aplicar</button>
      <button id="btn-limpiar-filtros" class="btn-secundario">Limpiar</button>
    </div>
    
<!-- Paginación Arriba -->
    <nav class="paginacion" aria-label="Paginación superior" style="margin-top: 2rem; margin-bottom: 2rem;">
      <ul>
        <li><a href="#" class="btn-anterior" onclick="cambiarPagina(-1); return false;" rel="prev">Anterior</a></li>
        <li><span class="texto-pagina" aria-current="page">Página 1</span></li>
        <li><a href="#" class="btn-siguiente" onclick="cambiarPagina(1); return false;" rel="next">Siguiente</a></li>
      </ul>
    </nav>

    <ul class="lista" id="contenedor-vinos">
      <!-- Los vinos se inyectan acá -->
    </ul>

    <!-- Paginación Abajo -->
    <nav class="paginacion" aria-label="Paginación inferior">
      <ul>
        <li><a href="#" class="btn-anterior" onclick="cambiarPagina(-1); return false;" rel="prev">Anterior</a></li>
        <li><span class="texto-pagina" aria-current="page">Página 1</span></li>
        <li><a href="#" class="btn-siguiente" onclick="cambiarPagina(1); return false;" rel="next">Siguiente</a></li>
      </ul>
    </nav>
  </main>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
