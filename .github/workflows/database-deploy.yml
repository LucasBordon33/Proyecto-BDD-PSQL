name: database-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    name: Migraciones y pruebas (postgres 16)

    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bodega

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d bodega"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: bodega
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Esperar PostgreSQL
        run: |
          set -e

          for i in $(seq 1 30); do
            if pg_isready \
              -h localhost \
              -p 5432 \
              -U postgres \
              -d bodega
            then
              echo "PostgreSQL listo ($i)"
              exit 0
            fi

            sleep 2
          done

          echo "PostgreSQL no inició"
          exit 1

      - name: Verificar PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d bodega \
            -c "SELECT version();"

      - name: Mostrar migraciones
        run: |
          ls -lah db/migrations
          find db/migrations -type f

      - name: Flyway Info Inicial
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}/db/migrations:/flyway/sql \
            flyway/flyway:10.22.0 \
            -X \
            -sqlMigrationPrefix= \
            -sqlMigrationSeparator=_ \
            -sqlMigrationSuffixes=.sql \
            -url=jdbc:postgresql://localhost:5432/bodega \
            -user=postgres \
            -password=postgres \
            info

      - name: Flyway Migrate
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}/db/migrations:/flyway/sql \
            flyway/flyway:10.22.0 \
            -X \
            -sqlMigrationPrefix= \
            -sqlMigrationSeparator=_ \
            -sqlMigrationSuffixes=.sql \
            -url=jdbc:postgresql://localhost:5432/bodega \
            -user=postgres \
            -password=postgres \
            migrate

      - name: Flyway Validate
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}/db/migrations:/flyway/sql \
            flyway/flyway:10.22.0 \
            -X \
            -sqlMigrationPrefix= \
            -sqlMigrationSeparator=_ \
            -sqlMigrationSuffixes=.sql \
            -url=jdbc:postgresql://localhost:5432/bodega \
            -user=postgres \
            -password=postgres \
            validate

      - name: Flyway Info Final
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}/db/migrations:/flyway/sql \
            flyway/flyway:10.22.0 \
            -sqlMigrationPrefix= \
            -sqlMigrationSeparator=_ \
            -sqlMigrationSuffixes=.sql \
            -url=jdbc:postgresql://localhost:5432/bodega \
            -user=postgres \
            -password=postgres \
            info

      - name: Mostrar historial Flyway
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d bodega \
            -c "SELECT * FROM flyway_schema_history ORDER BY installed_rank;"

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: Ejecutar pruebas
        run: uv run pytest -q

  desplegar:
    name: Desplegar migraciones a Neon

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs: pruebas

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Esperar Neon
        run: |
          for i in $(seq 1 30); do
            if pg_isready \
              -h "${{ secrets.NEON_HOST }}" \
              -p 5432 \
              -U app_migrator \
              -d "${{ secrets.NEON_DB }}"
            then
              exit 0
            fi

            sleep 2
          done

          exit 1

      - name: Flyway Migrate
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/db/migrations:/flyway/sql \
            flyway/flyway:10.22.0 \
            -sqlMigrationPrefix= \
            -sqlMigrationSeparator=_ \
            -sqlMigrationSuffixes=.sql \
            -url="jdbc:postgresql://${{ secrets.NEON_HOST }}/${{ secrets.NEON_DB }}?sslmode=require" \
            -user=app_migrator \
            -password="${{ secrets.NEON_MIGRATOR_PASSWORD }}" \
            migrate

      - name: Flyway Validate
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/db/migrations:/flyway/sql \
            flyway/flyway:10.22.0 \
            -sqlMigrationPrefix= \
            -sqlMigrationSeparator=_ \
            -sqlMigrationSuffixes=.sql \
            -url="jdbc:postgresql://${{ secrets.NEON_HOST }}/${{ secrets.NEON_DB }}?sslmode=require" \
            -user=app_migrator \
            -password="${{ secrets.NEON_MIGRATOR_PASSWORD }}" \
            validate

      - name: Smoke Test
        env:
          PGPASSWORD: ${{ secrets.NEON_MIGRATOR_PASSWORD }}
        run: |
          psql \
            -h "${{ secrets.NEON_HOST }}" \
            -U app_migrator \
            -d "${{ secrets.NEON_DB }}" \
            -c "SELECT count(*) FROM information_schema.tables;"