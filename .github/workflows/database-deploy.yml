name: database-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    name: Migraciones y pruebas (postgres 16)

    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bodega

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d bodega"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: bodega
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Esperar PostgreSQL
        run: |
          set -e

          for i in $(seq 1 30); do
            if pg_isready \
              -h localhost \
              -p 5432 \
              -U postgres \
              -d bodega
            then
              echo "PostgreSQL listo en intento $i"
              exit 0
            fi

            echo "Esperando PostgreSQL ($i/30)"
            sleep 2
          done

          echo "ERROR: PostgreSQL no inició correctamente"
          exit 1

      - name: Verificar conexión PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d bodega \
            -c "SELECT version();"

      - name: Instalar Flyway
        run: |
          set -euxo pipefail

          FLYWAY_VERSION=10.22.0

          curl -fsSL \
            "https://github.com/flyway/flyway/releases/download/v${FLYWAY_VERSION}/flyway-${FLYWAY_VERSION}-linux-x64.tar.gz" \
            -o flyway.tar.gz

          sudo tar -xzf flyway.tar.gz -C /opt

          sudo ln -sf \
            /opt/flyway-${FLYWAY_VERSION}/flyway \
            /usr/local/bin/flyway

          flyway --version

      - name: Verificar estructura del repositorio
        run: |
          pwd
          ls -la
          echo ""
          echo "Migraciones encontradas:"
          ls -lah db/migrations

      - name: Mostrar archivos SQL
        run: |
          find db/migrations -type f

      - name: Flyway Info inicial
        run: |
          flyway -X \
            -locations=filesystem:db/migrations \
            -sqlMigrationPrefix= \
            -sqlMigrationSeparator=_ \
            -sqlMigrationSuffixes=.sql \
            -url=jdbc:postgresql://localhost:5432/bodega \
            -user=postgres \
            -password=postgres \
            info

      - name: Flyway Validate
        run: |
          flyway -X \
            -locations=filesystem:db/migrations \
            -sqlMigrationPrefix= \
            -sqlMigrationSeparator=_ \
            -sqlMigrationSuffixes=.sql \
            -url=jdbc:postgresql://localhost:5432/bodega \
            -user=postgres \
            -password=postgres \
            validate

      - name: Flyway Repair
        run: |
          flyway \
            -locations=filesystem:db/migrations \
            -sqlMigrationPrefix= \
            -sqlMigrationSeparator=_ \
            -sqlMigrationSuffixes=.sql \
            -url=jdbc:postgresql://localhost:5432/bodega \
            -user=postgres \
            -password=postgres \
            repair || true

      - name: Flyway Migrate
        run: |
          flyway -X \
            -locations=filesystem:db/migrations \
            -sqlMigrationPrefix= \
            -sqlMigrationSeparator=_ \
            -sqlMigrationSuffixes=.sql \
            -url=jdbc:postgresql://localhost:5432/bodega \
            -user=postgres \
            -password=postgres \
            migrate

      - name: Flyway Info final
        run: |
          flyway \
            -locations=filesystem:db/migrations \
            -sqlMigrationPrefix= \
            -sqlMigrationSeparator=_ \
            -sqlMigrationSuffixes=.sql \
            -url=jdbc:postgresql://localhost:5432/bodega \
            -user=postgres \
            -password=postgres \
            info

      - name: Verificar tablas creadas
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d bodega \
            -c "\dt"

      - name: Mostrar historial Flyway
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d bodega \
            -c "SELECT * FROM flyway_schema_history ORDER BY installed_rank;"

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: Ejecutar pruebas
        run: uv run pytest -q

  desplegar:
    name: Desplegar migraciones a Neon

    if: github.event_name == 'push' &&
        github.ref == 'refs/heads/main'

    needs: pruebas

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Instalar Flyway
        run: |
          set -euxo pipefail

          FLYWAY_VERSION=10.22.0

          curl -fsSL \
            "https://github.com/flyway/flyway/releases/download/v${FLYWAY_VERSION}/flyway-${FLYWAY_VERSION}-linux-x64.tar.gz" \
            -o flyway.tar.gz

          sudo tar -xzf flyway.tar.gz -C /opt

          sudo ln -sf \
            /opt/flyway-${FLYWAY_VERSION}/flyway \
            /usr/local/bin/flyway

          flyway --version

      - name: Esperar Neon
        run: |
          for i in $(seq 1 30); do
            if pg_isready \
              -h "${{ secrets.NEON_HOST }}" \
              -p 5432 \
              -U app_migrator \
              -d "${{ secrets.NEON_DB }}"
            then
              echo "Neon listo"
              exit 0
            fi

            sleep 2
          done

          echo "No fue posible conectar con Neon"
          exit 1

      - name: Flyway Validate
        run: |
          flyway \
            -locations=filesystem:db/migrations \
            -sqlMigrationPrefix= \
            -sqlMigrationSeparator=_ \
            -sqlMigrationSuffixes=.sql \
            -url="jdbc:postgresql://${{ secrets.NEON_HOST }}/${{ secrets.NEON_DB }}?sslmode=require" \
            -user=app_migrator \
            -password="${{ secrets.NEON_MIGRATOR_PASSWORD }}" \
            validate

      - name: Flyway Migrate
        run: |
          flyway \
            -locations=filesystem:db/migrations \
            -sqlMigrationPrefix= \
            -sqlMigrationSeparator=_ \
            -sqlMigrationSuffixes=.sql \
            -url="jdbc:postgresql://${{ secrets.NEON_HOST }}/${{ secrets.NEON_DB }}?sslmode=require" \
            -user=app_migrator \
            -password="${{ secrets.NEON_MIGRATOR_PASSWORD }}" \
            migrate

      - name: Smoke Test
        env:
          PGPASSWORD: ${{ secrets.NEON_MIGRATOR_PASSWORD }}
        run: |
          psql \
            -h "${{ secrets.NEON_HOST }}" \
            -U app_migrator \
            -d "${{ secrets.NEON_DB }}" \
            -c "SELECT count(*) FROM information_schema.tables;"