name: database-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    name: Migraciones y pruebas (postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bodega
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d bodega" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: bodega
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Flyway CLI
        run: |
          curl -sfL https://github.com/flyway/flyway/releases/download/v10.22.0/flyway-10.22.0-linux-x86_64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/flyway-10.22.0/flyway /usr/local/bin/flyway
          flyway --version

      - name: Liberar bloqueos previos de PostgreSQL
        run: |
          docker run --rm --network host postgres:16-alpine psql "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable" \
            -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='bodega' AND pid<>pg_backend_pid();" || true

      - name: Ejecutar migraciones (Flyway)
        run: |
          flyway \
            -locations=filesystem:db/migrations \
            -sqlMigrationPrefix= \
            -sqlMigrationSeparator=_ \
            -url=jdbc:postgresql://localhost:5432/bodega \
            -user=postgres \
            -password=postgres \
            migrate

      - name: Validar migraciones (Flyway validate)
        run: |
          flyway \
            -locations=filesystem:db/migrations \
            -sqlMigrationPrefix= \
            -sqlMigrationSeparator=_ \
            -url=jdbc:postgresql://localhost:5432/bodega \
            -user=postgres \
            -password=postgres \
            validate

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: Ejecutar pruebas
        run: uv run pytest -q

  desplegar:
    name: Desplegar migraciones a Neon (producción)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Flyway CLI
        run: |
          curl -sfL https://github.com/flyway/flyway/releases/download/v10.22.0/flyway-10.22.0-linux-x86_64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/flyway-10.22.0/flyway /usr/local/bin/flyway
          flyway --version

      - name: Migrar base de datos productiva (endpoint directo, sin pooler)
        run: |
          flyway \
            -locations=filesystem:db/migrations \
            -sqlMigrationPrefix= \
            -sqlMigrationSeparator=_ \
            -url="jdbc:postgresql://${{ secrets.NEON_HOST }}/${{ secrets.NEON_DB }}?sslmode=require" \
            -user=app_migrator \
            -password="${{ secrets.NEON_MIGRATOR_PASSWORD }}" \
            migrate

      - name: Verificar éxito del despliegue (Flyway validate)
        run: |
          flyway \
            -locations=filesystem:db/migrations \
            -sqlMigrationPrefix= \
            -sqlMigrationSeparator=_ \
            -url="jdbc:postgresql://${{ secrets.NEON_HOST }}/${{ secrets.NEON_DB }}?sslmode=require" \
            -user=app_migrator \
            -password="${{ secrets.NEON_MIGRATOR_PASSWORD }}" \
            validate

      - name: Verificar éxito del despliegue (smoke test)
        run: >
          docker run --rm postgres:16-alpine
          psql "postgresql://app_migrator:${{ secrets.NEON_MIGRATOR_PASSWORD }}@${{ secrets.NEON_HOST }}/${{ secrets.NEON_DB }}?sslmode=require"
          -c "SELECT count(*) AS tablas_public FROM information_schema.tables WHERE table_schema = 'public';"