name: database-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    name: Migraciones y pruebas (postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bodega
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bodega"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: bodega
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v5

      - name: Instalar cliente PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Validar conectividad con PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres -d bodega; then
              echo "PostgreSQL listo"
              exit 0
            fi
            echo "Esperando a PostgreSQL... ($i/30)"
            sleep 2
          done
          echo "Error: Tiempo de espera agotado para PostgreSQL"
          exit 1

      - name: Instalar Flyway CLI
        run: |
          curl -sfL [github.com](https://github.com/flyway/flyway/releases/download/v10.22.0/flyway-10.22.0-linux-x86_64.tar.gz) | sudo tar -xz -C /opt
          sudo ln -s /opt/flyway-10.22.0/flyway /usr/local/bin/flyway
          flyway --version

      - name: Liberar bloqueos previos de Flyway/PostgreSQL
        run: |
          docker run --rm --network host postgres:16-alpine psql "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable" \
            -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='bodega' AND pid<>pg_backend_pid();" || true

      - name: Ejecutar migraciones (Flyway migrate)
        run: |
          flyway \
            -locations=filesystem:db/migrations \
            -sqlMigrationPrefix= \
            -sqlMigrationSeparator=_ \
            -url=jdbc:postgresql://localhost:5432/bodega \
            -user=postgres \
            -password=postgres \
            migrate

      - name: Validar migraciones (Flyway validate)
        run: |
          flyway \
            -locations=filesystem:db/migrations \
            -sqlMigrationPrefix= \
            -sqlMigrationSeparator=_ \
            -url=jdbc:postgresql://localhost:5432/bodega \
            -user=postgres \
            -password=postgres \
            validate

      - name: Información de migraciones aplicadas (flyway info)
        run: |
          flyway \
            -locations=filesystem:db/migrations \
            -sqlMigrationPrefix= \
            -sqlMigrationSeparator=_ \
            -url=jdbc:postgresql://localhost:5432/bodega \
            -user=postgres \
            -password=postgres \
            info

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: Ejecutar pruebas
        run: uv run pytest -q

  desplegar:
    name: Desplegar migraciones a Neon (producción)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar Flyway CLI
        run: |
          curl -sfL [github.com](https://github.com/flyway/flyway/releases/download/v10.22.0/flyway-10.22.0-linux-x86_64.tar.gz) | sudo tar -xz -C /opt
          sudo ln -s /opt/flyway-10.22.0/flyway /usr/local/bin/flyway
          flyway --version

      - name: Migrar base de datos productiva (endpoint directo, sin pooler)
        run: |
          flyway \
            -locations=filesystem:db/migrations \
            -sqlMigrationPrefix= \
            -sqlMigrationSeparator=_ \
            -url="jdbc:postgresql://${{ secrets.NEON_HOST }}/${{ secrets.NEON_DB }}?sslmode=require" \
            -user=app_migrator \
            -password="${{ secrets.NEON_MIGRATOR_PASSWORD }}" \
            migrate

      - name: Verificar éxito del despliegue (Flyway validate)
        run: |
          flyway \
            -locations=filesystem:db/migrations \
            -sqlMigrationPrefix= \
            -sqlMigrationSeparator=_ \
            -url="jdbc:postgresql://${{ secrets.NEON_HOST }}/${{ secrets.NEON_DB }}?sslmode=require" \
            -user=app_migrator \
            -password="${{ secrets.NEON_MIGRATOR_PASSWORD }}" \
            validate

      - name: Verificar éxito del despliegue (smoke test)
        run: >
          docker run --rm postgres:16-alpine
          psql "postgresql://app_migrator:${{ secrets.NEON_MIGRATOR_PASSWORD }}@${{ secrets.NEON_HOST }}/${{ secrets.NEON_DB }}?sslmode=require"
          -c "SELECT count(*) AS tablas_public FROM information_schema.tables WHERE table_schema = 'public';"