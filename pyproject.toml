[project]
name = "proyecto-base-de-datos"
version = "0.1.0"
description = "Proyecto de base de datos hecho por Lucas Bordón Matias Bordón Juan Andres Lopez"
readme = "README.md"
authors = [
    { name = "LucasBordon33", email = "lucasnayaresc7@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "asyncpg>=0.32.0",
]

[project.scripts]
proyecto-base-de-datos = "proyecto_base_de_datos:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
