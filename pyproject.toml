[project]
name = "proyecto-base-de-datos"
version = "0.1.0"
description = "Proyecto de base de datos hecho por Lucas Bordón Matias Bordón Juan Andres Lopez"
readme = "README.md"
authors = [
    { name = "LucasBordon33", email = "lucasnayaresc7@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0,<3.0.0",
    "asyncpg>=0.32.0",
]

[project.scripts]
proyecto-base-de-datos = "proyecto_base_de_datos:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

# Grupo de desarrollo (PEP 735): `uv sync` lo instala por defecto y el
# Dockerfile lo excluye con `uv sync --no-dev`.
# - pytest / httpx: suite de pruebas (tests/)
# - psycopg[binary] / faker / python-dotenv: carga masiva (db/seed/script_carga.py)
[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "psycopg[binary]>=3.2",
    "faker>=40.0.0",
    "python-dotenv>=1.0.0",
]
