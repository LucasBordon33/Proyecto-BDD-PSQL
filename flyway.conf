# Configuración Flyway para este repositorio
# Las migraciones existentes usan el formato NN_nombre.sql (ej.: 001_esquema.sql),
# por lo que se desactiva el prefijo "V" y se fija el separador en "_".
flyway.locations=filesystem:db/migrations
flyway.sqlMigrationPrefix=
flyway.sqlMigrationSeparator=_
flyway.validateMigrationNaming=true
flyway.validateOnMigrate=true
